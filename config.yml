# =============================================================================
# config.yml — single source of truth for the DSSAT gridded pipeline.
#
# Both the R pipeline (dssat_main_pipeline.R) and the Python port
# (dssat_main_pipeline.py) read this file at the top of SECTION 0. Any key
# present here defines the shared R/Python default. A file selected with
# DSSAT_CONFIG_FILE is merged over this mapping, so study configs only need to
# contain values they change. Keep user-adjustable settings here rather than in
# the pipeline source files.
#
# This prevents the R-vs-Python SECTION-0 settings from drifting apart: edit
# once here and both pipelines pick it up.
# =============================================================================

# --- Project / grid ---
project_name:         "dssat_spatial_demo"
grid_spacing_meters:  20000          # 20 km demo; 5000-10000 for production
crop_extension:       "MZ"           # MZ=maize, WH=wheat, SB=soybean, ...

# --- Roots and directories ---
# Blank paths use portable locations derived from this repository. Relative
# paths are resolved against the repository, not the caller's current folder.
input_root_dir:        ""
output_root_dir:       ""
shapefile_dir:         ""
gridpoints_dir:        ""
weather_root_dir:      ""
soil_root_dir:         ""
runs_root_dir:         ""
results_root_dir:      ""
template_dir:          ""

# DSSAT executable discovery. Blank values use platform defaults and the
# sibling ../DSSAT48 checkout when available. Environment variables DSSAT_EXE
# and DSSAT_BASE have highest priority and are convenient for CI/HPC.
dssat_base:            ""
dssat_executable_name: ""
dssat_exe_path:        ""

# --- Run-folder naming ---
run_tag:              ""             # e.g. "run1"; "" = default naming
run_name_style:       "grid"         # "grid" or "scenario"
run_name_override:    ""             # exact run-folder name if non-empty

# --- Spatial domain ---
use_existing_point_shapefile: false  # false = MODE A grid; true = MODE B/C
existing_point_shapefile_path: ""    # MODE B/C: path to your .shp (blank = script default)
boundary_shapefile_name: "tl_2024_us_state.shp"
enable_boundary_filter:  true
boundary_filter_column:  "NAME"
state_name_filter:    ["Iowa"]       # list; matched against boundary_filter_column

# --- Optional nested master-grid sampling ---
# false keeps the legacy behavior, where every requested spacing is generated
# independently. true creates/reuses one fixed-origin master lattice and derives
# exact nested subsets; target grid_spacing_meters must be an integer multiple.
use_master_grid:              false
master_grid_spacing_meters:   1000
master_grid_crs:              "EPSG:6933"  # global equal-area; use EPSG:5070 for CONUS studies
master_grid_origin_x:         0
master_grid_origin_y:         0
master_grid_phase_row:        0
master_grid_phase_col:        0
master_grid_path:             ""      # blank = <gridpoints>/<project>_master_<spacing>.gpkg
reuse_master_grid:            true

# --- Optional cropland mask ---
# Prototype workflow for running only on cropland. When enabled, the pipeline
# computes the cropland fraction for each generated grid cell from a local
# categorical raster, keeps only cells with cropland fraction above the threshold,
# and carries cropland area into the final results CSV.
use_cropland_mask:      false
cropland_raster_file:   "data/Annual_NLCD_LndCov_2024_CU_C1V1.tif"  # local NLCD/CDL GeoTIFF; used only when enabled
cropland_classes:       [82]         # NLCD class 82 = cultivated crops
cropland_min_fraction:  0            # 0 means keep cells with >0 cropland
cropland_strict:        false        # true = stop if raster/dependency is missing
reuse_cropland_grid:    true         # reuse saved cropland grid for same project/res/classes/threshold
cropland_filter_basis:  "cell_fraction" # cell_fraction (legacy) or point (strict nested membership)
cropland_clip_to_boundary: true      # clip square cells to the selected study boundary before area/fraction
cropland_relocate_anchor: false      # optionally move retained points to the nearest in-cell cropland pixel

# --- Weather ---
# DAYMET (N.Am) | NASA_POWER (global) | GRIDMET (US) | OPEN_METEO (global ERA5, keyless)
# | NASA_POWER_CHIRPS (global, NASA POWER + CHIRPS v2 rainfall, 50S-50N)
# | NASA_POWER_CHIRPS_V3 (global, NASA POWER + CHIRPS v3 rainfall, 60S-60N)
# | AGERA5 (global 0.1deg, ag-tuned; needs a free Copernicus CDS API key)
# | DWD (Germany; quality-controlled stations, keyless; SRAD from sunshine duration)
# | EOBS (Europe 0.1deg gridded; carries daily global radiation; see eobs_* keys)
# | XAVIER (Brazil 0.1deg BR-DWGD grid; local NetCDFs; see xavier_nc_dir)
# | CMFD (China 0.1deg, 3-hourly->daily; local NetCDFs, free TPDC account; see cmfd_nc_dir)
# | gridpoints_weather (offline/cached or pre-generated)
weather_source:       "NASA_POWER"
weather_start_year:   1992           # NASA_POWER not available before 1984
weather_end_year:     1992
chirps_resolution:    "p05"          # NASA_POWER_CHIRPS only: p05 (~5.5km) | p25 (~28km, lighter)
chirps_v3_product:    "rnl"          # NASA_POWER_CHIRPS_V3 only: rnl (gauge-adjusted final) | sat (satellite-only)
chirps_v3_stream:     "final"        # NASA_POWER_CHIRPS_V3 only: final | prelim (prelim supports sat/yearly only)
chirps_v3_fetch_mode: "monthly_netcdf" # NASA_POWER_CHIRPS_V3 only: monthly_netcdf (recommended) | yearly_netcdf
chirps_v3_resolution: "p05"          # NASA_POWER_CHIRPS_V3 only: currently p05 daily rainfall
chirps_v3_months:     []             # NASA_POWER_CHIRPS_V3 only: [] = all months; e.g. [10,11,12,1,2,3,4] to limit downloads
chirps_gee_project:   ""             # GEE mode only: Google Earth Engine project ID
chirps_download_timeout: null         # seconds; null = dssatutils package default
agera5_backend: "timeseries"         # recommended: compact point/small-area time series | gridded: legacy daily-NetCDF ZIPs
agera5_data_format: "csv"             # time-series backend currently supports csv
agera5_timeseries_chunk_degrees: 0.1  # 0.1 = reusable AgERA5-cell cache; <=4.6 leaves room for padding under CDS 5deg limit
agera5_max_concurrent_requests: 4    # AgERA5 only: bounded CDS queue (hard cap in dssatutils: 4)
eobs_nc_dir:          ""             # EOBS only: folder of pre-downloaded E-OBS NetCDFs (blank = eobs_netcdf/)
eobs_use_cds:         false          # EOBS only: true = fetch via Copernicus CDS; run setup_cds_credentials() once
xavier_nc_dir:        ""             # XAVIER only: folder of BR-DWGD NetCDFs Tmax/Tmin/pr/Rs/RH/u2 (blank = xavier_netcdf/)
cmfd_nc_dir:          ""             # CMFD only: folder of CMFD NetCDFs temp/prec/srad/shum/pres/wind (blank = cmfd_netcdf/)
chelsa_nc_dir:        ""
agmerra_nc_dir:       ""
agcfsr_nc_dir:        ""
silo_nc_dir:          ""
prism_cache_dir:      ""
mswx_nc_dir:          ""
mswep_nc_dir:         ""
crujra_nc_dir:        ""
terraclimate_nc_dir:  ""

soil_source:          "SSURGO_ALDERMAN"  # SSURGO | GNATSGO | ISDASOIL | LUCAS | SOILGRIDS_10K | SOILGRIDS_ONLINE | HWSD | SSURGO_ALDERMAN
statsgo:              false
standardize_layers:   true
# GNATSGO  (US, 30m, keyless): gap-free USDA grid; fills SSURGO's un-surveyed holes.
# ISDASOIL (Africa, 30m, keyless): iSDAsoil COGs (0-20 & 20-50cm), Saxton-Rawls.
# LUCAS    (Europe, keyless but ESDAC request): nearest measured topsoil sample (see lucas_csv).
# GNATSGO/ISDASOIL/SSURGO write per-point .SOL with no external file needed.
external_soil_file:   ""                # SOILGRIDS_10K only; blank = script default (SoilGrids/US.SOL)
lucas_csv:            ""                # LUCAS only: downloaded ESDAC LUCAS topsoil table (blank = LUCAS/lucas_topsoil.csv)
soilgrids_mode:       "REST"            # SOILGRIDS_ONLINE only: REST (keyless, rate-limited) | VRT (needs rasterio; batch-friendly, better coverage)
hwsd_raster_file:     ""                # HWSD only: FAO HWSD2 raster of mapping-unit IDs (blank = HWSD/HWSD2.bil)
hwsd_db_file:         ""                # HWSD only: FAO HWSD2 attribute DB - the FAO MS Access .mdb directly OR a converted .sqlite (blank = HWSD/HWSD2.sqlite)
polaris_stat:         "p50"
polaris_cache_dir:    ""
hihydrosoil_raster_dir: ""
slga_raster_dir:      ""
wise30sec_raster_dir: ""
wosis_profile_csv:    ""

# --- DSSAT template / run mode ---
template_file_name:   "UFGA9201.MZX"
template_soil_id_placeholder: "SOIL_ID"
run_mode:             "experiment"   # experiment | sequence
# Use treatment_start/treatment_end for a contiguous range. Use treatment_list
# only when you need explicit non-contiguous IDs, e.g. [1, 5, 10].
treatment_start:      1
treatment_end:        1
treatment_list:       []
sequence_start:       1
sequence_end:         1

# --- Performance / parallelism ---
# "auto" (default) = use all logical CPUs minus 1.
# Set an integer to fix the count (e.g. 4 for a 4-core laptop, or 64 on HPC).
# Soil and weather steps are API/IO-bound so more goroutines than CPUs is fine.
# DSSAT is CPU+disk-bound; set dssat_cores <= n_physical_cores for best throughput.
soil_cores:           "auto"
weather_cores:        "auto"
dssat_cores:          "auto"

# --- Support file bundling ---
# false (default): rely on DSSATPRO.V48 next to the executable to resolve
#   genotype/species/SDA/CO2 files — run folders stay tiny (big metadata saving
#   at scale). true: copy those ~27 files into every folder for self-contained
#   runs (auto-forced when ZIP_FOR_HPC is set, since folders move to another host).
bundle_genotype_files: false
use_symlinks:          false  # portable default; Python can opt in, with copy fallback

# --- Pipeline step switches ---
# Set individual steps to false to skip them (e.g. when re-running on cached data).
run_step_1_soils:    true   # false = skip soil download/processing; use cached files
run_step_2_weather:  true   # false = skip weather download/processing; use cached files
download_only:       false  # true = stop after soil/weather processing; do not create DSSAT run folders
run_dssat_execution: true   # false = HPC prep mode (creates folders but does not run DSSAT)

# --- Weather extension ---
extend_weather_data:     false  # set to true to fill partial years by climatological repeat
weather_reference_year:  2025  # the historic year used as the repeat source

# Optional, conservative weather repair/QA. Repairs only short gaps with valid
# neighbors; audit is flag-only. Keep disabled unless the study calls for it.
repair_weather_missing_values: false
repair_weather_date_gaps: false
repair_weather_temperature_inversions: false
audit_weather_quality: false
weather_repair_max_gap_days: 3
weather_repair_window_days: 2
weather_quality_flatline_days: 10
weather_repair_variables: ["SRAD", "TMAX", "TMIN", "RAIN", "TDEW", "RH2M", "WIND"]

# --- Stop / Resume / HPC ---
resume_dssat_runs:    false  # set to true to skip points whose results_{ID}.csv already exists
zip_for_hpc:          false  # set to true to zip the run folder after creation (HPC upload)
cleanup_run_folders:  false  # set to true to delete all per-point simulation folders after combining results
archive_failed_run_folders: false  # zip failed point folders beside the scenario CSV before cleanup

# --- Download validation and retries ---
check_weather_downloads:  false  # set to true to validate weather file contents and retry failures
weather_download_retries: 3      # max retries for failed weather downloads
check_soil_downloads:     false  # set to true to validate soil profile files (.SOL) and retry failures
soil_download_retries:    3      # max retries for failed soil downloads
