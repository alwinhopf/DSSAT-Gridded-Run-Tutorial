name: smoke

# Force JS actions to Node.js 24 on the runner (opt-in)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DSSATUTILS_REF: 'e9c859fa1d915623df23e2eb13084cb085dbfe3e'
  DSSATENGINE_REF: '7c6777ccefb9db38d2e3981ed9711b9c0ce58f6e'
  DSSAT_REQUIRE_PARITY_SOURCES: '1'

# Offline smoke test: no internet APIs, no DSSAT executable required.
# Validates config loading, helper-module imports, and the DSSAT .WTH writer.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-smoke:
    name: Python offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      # The parity tests inspect both language implementations. Check out the
      # exact dependency revisions under the path they know how to resolve so
      # a clean GitHub runner cannot silently skip those assertions.
      - uses: actions/checkout@v6
        with:
          repository: alwinhopf/dssatutils
          ref: ${{ env.DSSATUTILS_REF }}
          path: .ci-deps/dssatutils
      - uses: actions/checkout@v6
        with:
          repository: alwinhopf/dssatengine
          ref: ${{ env.DSSATENGINE_REF }}
          path: .ci-deps/dssatengine

      # The cross-language config test launches Rscript from pytest. Provision
      # R explicitly so the test runs consistently instead of depending on
      # whichever tools happen to be preinstalled on a hosted runner.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install R parity dependency
        # Match the --vanilla R process launched by the parity test. Without
        # this flag, the repository .Rprofile activates renv and installs yaml
        # into a project library that the test intentionally does not load.
        run: >-
          Rscript --vanilla -e
          'install.packages("yaml", repos="https://cloud.r-project.org");
          stopifnot(requireNamespace("yaml", quietly=TRUE))'

      - name: Install minimal deps
        # Only what the offline smoke test needs; heavy/optional geo + MPI deps
        # are skipped gracefully by the test if absent.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pytest
          pip install "dssatutils @ git+https://github.com/alwinhopf/dssatutils.git@${{ env.DSSATUTILS_REF }}"

      - name: Run offline smoke test
        run: python -m pytest -m "not integration and not slow" -v

      - name: Byte-compile all pipeline modules
        run: python -m compileall -q dssat_main_pipeline.py config_loader.py python_scripts tests

  r-config:
    name: R config/syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install YAML dependency
        run: >-
          Rscript --vanilla -e
          'install.packages("yaml", repos="https://cloud.r-project.org");
          stopifnot(requireNamespace("yaml", quietly=TRUE))'
      - name: Validate central config and R syntax
        run: >-
          Rscript --vanilla -e 'source("config_loader.R");
          stopifnot(cfg_get("weather_source", "") != "");
          parse(file="dssat_main_pipeline.R");
          parse(file="tests/test_e2e.R");
          parse(file="tests/test_e2e_comprehensive.R");
          parse(file="tests/test_dssat_model_e2e.R")'
