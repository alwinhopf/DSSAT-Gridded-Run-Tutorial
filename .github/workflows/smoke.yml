name: smoke

# Force JS actions to Node.js 24 on the runner (opt-in)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Offline smoke test: no internet APIs, no DSSAT executable required.
# Validates config loading, helper-module imports, and the DSSAT .WTH writer.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-smoke:
    name: Python offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        # Only what the offline smoke test needs; heavy/optional geo + MPI deps
        # are skipped gracefully by the test if absent.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pytest
          pip install 'dssatutils @ git+https://github.com/alwinhopf/dssatutils.git@v0.4.0'

      - name: Run offline smoke test
        run: python -m pytest -m "not integration and not slow" -v

      - name: Byte-compile all pipeline modules
        run: python -m compileall -q dssat_main_pipeline.py config_loader.py python_scripts tests

  r-config:
    name: R config/syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install YAML dependency
        run: Rscript -e 'install.packages("yaml")'
      - name: Validate central config and R syntax
        run: >-
          Rscript -e 'source("config_loader.R");
          stopifnot(cfg_get("weather_source", "") != "");
          parse(file="dssat_main_pipeline.R");
          parse(file="tests/test_e2e.R");
          parse(file="tests/test_e2e_comprehensive.R")'
