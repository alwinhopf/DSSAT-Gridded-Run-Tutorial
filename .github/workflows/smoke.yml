name: smoke

# Multi-lane CI architecture: isolated fast unit tests, behavioral parity contracts, and platform compatibility.
env:
  CROPMODEL_READ_TOKEN: ${{ secrets.CROPMODEL_READ_TOKEN }}
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"
  PYTHONUTF8: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Sibling repository pinned revisions
  CROPMODEL_REF: '4dd81c1c3636dd26f2b5f801af726bdfdbfcb6d9'

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Lane 1: Fast deterministic unit tests + R syntax validation (PR gate)
  unit-tests:
    name: Fast Unit Tests & R Syntax (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Check private dependency credentials
        run: python scripts/install_ci_dependencies.py --check-only

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      - name: Install minimal Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pytest
          python scripts/install_ci_dependencies.py

      - name: Install minimal R dependencies
        run: >-
          Rscript --vanilla -e
          'install.packages(c("yaml", "jsonlite"), repos="https://cloud.r-project.org");
          stopifnot(requireNamespace("yaml", quietly=TRUE));
          stopifnot(requireNamespace("jsonlite", quietly=TRUE))'

      - name: Exact local pre-push suite
        shell: bash
        run: bash scripts/pre-push.sh

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-results
          path: |
            test-results.xml
            *.log
          if-no-files-found: ignore

  # Lane 2: Cross-language behavioral parity contract tests
  parity-contracts:
    name: Language Parity & Behavioral Contracts (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Check private dependency credentials
        run: python scripts/install_ci_dependencies.py --check-only

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: alwinhopf/cropmodel
          token: ${{ secrets.CROPMODEL_READ_TOKEN }}
          ref: ${{ env.CROPMODEL_REF }}
          path: .ci-deps/cropmodel
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      - name: Install shared R package dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: .ci-deps/cropmodel/packages/cropmodel_data/R/cropmodeldata
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::yaml, any::jsonlite, any::sf, any::terra, any::DSSAT, any::foreach, any::doParallel, any::pbapply, any::tidyr, any::stringr, any::lubridate, any::readr, any::dplyr
          install-pandoc: false

      - name: Install exact pinned native R packages
        run: |
          R CMD INSTALL .ci-deps/cropmodel/packages/cropmodel_data/R/cropmodeldata
          R CMD INSTALL .ci-deps/cropmodel/packages/cropmodel_runtime/R/cropmodelruntime

      - name: Install R parity dependencies
        run: >-
          Rscript --vanilla -e
          'install.packages(c("yaml", "jsonlite"), repos="https://cloud.r-project.org");
          stopifnot(requireNamespace("yaml", quietly=TRUE));
          stopifnot(requireNamespace("jsonlite", quietly=TRUE))'

      - name: Install Python parity dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pytest geopandas shapely rasterio matplotlib
          python scripts/install_ci_dependencies.py

      - name: Run cross-language parity & behavioral contract tests
        run: >-
          python -m pytest tests -m "not integration and not slow"
          -v --tb=short --junit-xml=parity-test-results.xml

      - name: Upload parity test results and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parity-test-results
          path: |
            parity-test-results.xml
            *.log
          if-no-files-found: ignore

  # Lane 3: Platform compatibility matrix (isolated from required PR gate)
  platform-compat:
    name: Platform Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Check private dependency credentials
        run: python scripts/install_ci_dependencies.py --check-only

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      - name: Install minimal Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pytest
          python scripts/install_ci_dependencies.py

      - name: Install minimal R dependencies
        run: >-
          Rscript --vanilla -e
          'install.packages(c("yaml", "jsonlite"), repos="https://cloud.r-project.org");
          stopifnot(requireNamespace("yaml", quietly=TRUE));
          stopifnot(requireNamespace("jsonlite", quietly=TRUE))'

      - name: Run fast offline unit tests
        run: >-
          pytest tests/test_smoke.py tests/test_agera5_config.py tests/test_failed_run_archive.py tests/test_provider_cache_and_fields.py
          tests/test_hpc_run_integrity.py tests/test_experiment_contract.py tests/test_scenario_completion.py
          -v --tb=short --junit-xml=platform-test-results.xml

      - name: Validate central config and R syntax
        run: >-
          Rscript --vanilla -e 'source("config_loader.R");
          stopifnot(cfg_get("weather_source", "") != "");
          parse(file="dssat_main_pipeline.R")'

      - name: Byte-compile all pipeline modules
        run: python -m compileall -q dssat_main_pipeline.py config_loader.py python_scripts tests

      - name: Upload platform test results and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-test-results-${{ matrix.os }}
          path: |
            platform-test-results.xml
            *.log
          if-no-files-found: ignore
