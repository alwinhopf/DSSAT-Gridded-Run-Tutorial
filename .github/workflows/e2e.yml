name: Comprehensive E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DSSATUTILS_REF: 'v0.4.0'
  DSSATENGINE_REF: 'be06ba0268d51dd1ec6f6baa62ea5ed7869165a9'
  DSSAT_PROVIDER_RETRIES: '3'

jobs:
  comprehensive-tests:
    name: E2E Tests (Weather & Soil Sources)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: python
            python-version: '3.11'
          - test-type: r
            r-version: '4.3'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # --- Python Setup ---
      - name: Set up Python
        if: matrix.test-type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache Python packages
        if: matrix.test-type == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        if: matrix.test-type == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy geopandas shapely
          pip install "dssatutils @ git+https://github.com/alwinhopf/dssatutils.git@${DSSATUTILS_REF}"
          pip install "dssatengine @ git+https://github.com/alwinhopf/dssatengine.git@${DSSATENGINE_REF}"
      
      - name: Run Python provider and optional DSSAT tests
        if: matrix.test-type == 'python'
        run: |
          pytest tests/test_e2e_comprehensive.py tests/test_dssat_model_e2e.py \
            -v --tb=short --junit-xml=pytest-results.xml
      
      - name: Upload Python test results
        if: matrix.test-type == 'python' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
      
      # --- R Setup ---
      - name: Set up R
        if: matrix.test-type == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      
      - name: Cache R packages
        if: matrix.test-type == 'r'
        uses: actions/cache@v4
        with:
          path: ~/.cache/R
          key: ${{ runner.os }}-r-${{ matrix.r-version }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ matrix.r-version }}-
      
      - name: Install R system dependencies
        if: matrix.test-type == 'r'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libspatialindex-dev \
            libsqlite3-dev \
            libudunits2-dev
      
      - name: Install R dependencies
        if: matrix.test-type == 'r'
        run: |
          R --slave -e "install.packages(c('remotes', 'doParallel', 'sf', 'terra', 'DBI', 'RSQLite'), repos=getOption('repos'))"
          R --slave -e "remotes::install_git('https://github.com/alwinhopf/dssatutils.git', ref='${DSSATUTILS_REF}')"
          R --slave -e "remotes::install_git('https://github.com/alwinhopf/dssatengine.git', ref='${DSSATENGINE_REF}')"
      
      - name: Run R comprehensive tests
        if: matrix.test-type == 'r'
        env:
          DSSAT_RUN_LIVE_E2E: '1'
        run: |
          Rscript tests/test_e2e_comprehensive.R

      - name: Run optional real DSSAT smoke test (R)
        if: matrix.test-type == 'r'
        run: Rscript --vanilla tests/test_dssat_model_e2e.R
      
      - name: Upload R test logs
        if: matrix.test-type == 'r' && always()
        uses: actions/upload-artifact@v4
        with:
          name: r-test-logs
          path: 'dssat_runs/e2e-r-*/**/*.log'
          if-no-files-found: warn
  
  # --- Status Check ---
  test-status:
    name: Test Status
    runs-on: ubuntu-latest
    needs: comprehensive-tests
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.comprehensive-tests.result }}" == "success" ]; then
            echo "✅ Comprehensive test matrix passed"
            exit 0
          else
            echo "❌ Comprehensive test matrix result: ${{ needs.comprehensive-tests.result }}"
            exit 1
          fi
