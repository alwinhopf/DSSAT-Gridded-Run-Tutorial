name: Comprehensive E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DSSATUTILS_REF: 'v0.4.0'

jobs:
  comprehensive-tests:
    name: E2E Tests (Weather & Soil Sources)
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: python
            python-version: '3.11'
          - test-type: r
            r-version: '4.3'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # --- Python Setup ---
      - name: Set up Python
        if: matrix.test-type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache Python packages
        if: matrix.test-type == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        if: matrix.test-type == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy geopandas shapely
          pip install "dssatutils @ git+https://github.com/alwinhopf/dssatutils.git@${DSSATUTILS_REF}"
      
      - name: Run Python comprehensive tests
        if: matrix.test-type == 'python'
        run: |
          pytest tests/test_e2e_comprehensive.py -v --tb=short --junit-xml=pytest-results.xml
        continue-on-error: true
      
      - name: Upload Python test results
        if: matrix.test-type == 'python'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
        continue-on-error: true
      
      # --- R Setup ---
      - name: Set up R
        if: matrix.test-type == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      
      - name: Cache R packages
        if: matrix.test-type == 'r'
        uses: actions/cache@v4
        with:
          path: ~/.cache/R
          key: ${{ runner.os }}-r-${{ matrix.r-version }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ matrix.r-version }}-
      
      - name: Install R system dependencies
        if: matrix.test-type == 'r'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libspatialindex-dev
      
      - name: Install R dependencies
        if: matrix.test-type == 'r'
        run: |
          R --slave -e "install.packages(c('remotes', 'parallel', 'doParallel', 'sf', 'terra'), repos='https://cran.r-project.org/')"
          R --slave -e "remotes::install_git('https://github.com/alwinhopf/dssatutils.git', ref='${DSSATUTILS_REF}')"
        continue-on-error: true
      
      - name: Run R comprehensive tests
        if: matrix.test-type == 'r'
        run: |
          Rscript tests/test_e2e_comprehensive.R
        continue-on-error: true
      
      - name: Upload R test logs
        if: matrix.test-type == 'r'
        uses: actions/upload-artifact@v4
        with:
          name: r-test-logs
          path: 'dssat_runs/**/run.log'
        continue-on-error: true
  
  # --- Status Check ---
  test-status:
    name: Test Status
    runs-on: ubuntu-latest
    needs: comprehensive-tests
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.comprehensive-tests.result }}" == "failure" ]; then
            echo "❌ Comprehensive tests failed or had errors"
            exit 1
          else
            echo "✅ Comprehensive tests passed or skipped gracefully"
            exit 0
          fi
