name: Comprehensive E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Immutable shared revisions include serialized GridMET/HDF5 validation,
  # declared weather units, and aligned missing-value handling.
  # Must provide the modules imported by both the Python and R integration
  # suites; keep this in sync with smoke.yml.
  DSSATUTILS_REF: 'f728cd810923465360e4730d8893bb566dc0773c'
  DSSATENGINE_REF: '14871db233af97a378fd42fb0c9749b5ff9b9453'
  DSSAT_PROVIDER_RETRIES: '3'
  # This job installs an explicit integration-test package set. Avoid activating
  # a deliberately partial renv library in the main process and its workers.
  RENV_CONFIG_AUTOLOADER_ENABLED: 'FALSE'

jobs:
  comprehensive-tests:
    name: E2E Tests (Weather & Soil Sources)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: python
            python-version: '3.11'
          - test-type: r
            r-version: '4.3'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      # --- Python Setup ---
      - name: Set up Python
        if: matrix.test-type == 'python'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache Python packages
        if: matrix.test-type == 'python'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        if: matrix.test-type == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy geopandas shapely
          pip install "dssatutils @ git+https://github.com/alwinhopf/dssatutils.git@${DSSATUTILS_REF}"
          pip install "dssatengine @ git+https://github.com/alwinhopf/dssatengine.git@${DSSATENGINE_REF}"
      
      - name: Run Python provider and optional DSSAT tests
        if: matrix.test-type == 'python'
        run: |
          pytest tests/test_e2e_comprehensive.py tests/test_dssat_model_e2e.py \
            -v --tb=short --junit-xml=pytest-results.xml
      
      - name: Upload Python test results
        if: matrix.test-type == 'python' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
      
      # --- R Setup ---
      - name: Set up R
        if: matrix.test-type == 'r'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      
      - name: Cache R packages
        if: matrix.test-type == 'r'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/R
          key: ${{ runner.os }}-r-${{ matrix.r-version }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ matrix.r-version }}-
      
      - name: Install R system dependencies
        if: matrix.test-type == 'r'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libspatialindex-dev \
            libsqlite3-dev \
            libudunits2-dev
      
      - name: Install R dependencies
        if: matrix.test-type == 'r'
        # remotes otherwise falls back to its bundled CI token when resolving
        # dssatengine's Remotes field. That fallback token can be revoked and
        # caused public GitHub dependency installs to fail with HTTP 401.
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          R --slave -e "install.packages(c('remotes', 'doParallel', 'sf', 'terra', 'DBI', 'RSQLite'), repos=getOption('repos'))"
          R --slave -e "remotes::install_git('https://github.com/alwinhopf/dssatutils.git', ref='${DSSATUTILS_REF}')"
          R --slave -e "remotes::install_git('https://github.com/alwinhopf/dssatengine.git', ref='${DSSATENGINE_REF}', dependencies=FALSE, upgrade='never')"
      
      - name: Run R comprehensive tests
        if: matrix.test-type == 'r'
        env:
          DSSAT_RUN_LIVE_E2E: '1'
        run: |
          Rscript tests/test_e2e_comprehensive.R

      - name: Run optional real DSSAT smoke test (R)
        if: matrix.test-type == 'r'
        run: Rscript --vanilla tests/test_dssat_model_e2e.R
      
      - name: Upload R test logs
        if: matrix.test-type == 'r' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: r-test-logs
          path: 'dssat_runs/e2e-r-*/**/*.log'
          if-no-files-found: warn
  
  # --- Status Check ---
  test-status:
    name: Test Status
    runs-on: ubuntu-latest
    needs: comprehensive-tests
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.comprehensive-tests.result }}" == "success" ]; then
            echo "✅ Comprehensive test matrix passed"
            exit 0
          else
            echo "❌ Comprehensive test matrix result: ${{ needs.comprehensive-tests.result }}"
            exit 1
          fi
