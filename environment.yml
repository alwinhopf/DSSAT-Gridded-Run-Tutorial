# Conda/mamba environment for the DSSAT gridded Python pipeline.
#
# Source of truth for Python dependencies. Generate a reproducible lock with:
#   conda install -c conda-forge conda-lock
#   conda-lock -f environment.yml -p win-64 -p linux-64
#   conda-lock install -n dssat_grid conda_lock.yml
#
# HPC note: mpi4py is intentionally left to pip so it can be built against the
# cluster's MPI. After activating, run:
#   pip install --no-cache-dir --no-binary :all: mpi4py==3.1.6
name: dssat_grid
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - geopandas=0.14.4
  - shapely=2.0.4
  - pyproj=3.6.1
  - fiona=1.9.6
  - rasterio=1.3.10
  - xarray=2024.6.0
  - netcdf4=1.6.5
  - requests=2.32.3
  - tqdm=4.66.4
  - pyyaml=6.0.1
  - pip
  - pytest=8.2.2
  # mpi4py via pip on HPC (see note above); uncomment for a local conda MPI:
  # - mpi4py=3.1.6
  - pip:
      # Shared package pins. Bump these deliberately when validating a new
      # workspace release; avoid branch pins so clean installs are reproducible.
      - dssatutils[cds] @ git+https://github.com/alwinhopf/dssatutils.git@v0.4.0
      # dssatengine is package-version 0.4.0; pin the verified release commit
      # until the matching v0.4.0 Git tag is pushed.
      - dssatengine @ git+https://github.com/alwinhopf/dssatengine.git@be06ba0268d51dd1ec6f6baa62ea5ed7869165a9
      # CDS-backed weather sources (AgERA5, ERA5-Land, E-OBS CDS mode)
      # still require user credentials; run setup_cds_credentials() once.
